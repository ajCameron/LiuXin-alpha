[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liuxin-alpha"
version = "0.0.0"
description = "LiuXin alpha codebase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "chardet>=5.0",
  "cssselect>=1.2",
  "lxml>=5.0",
  "numpy>=1.26",
]

[project.scripts]
liuxin = "LiuXin_alpha.surfaces.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-json-report>=1.5",
  "pytest-xdist>=3.5",
  "python-dateutil>=2.8",
  "py7zr>=1.1.3,<2",
  "pycdlib>=1.20,<2",
  "rarfile>=4.5,<5",
]
search = [
  "rapidfuzz>=3.9",
]
postgres = [
  "psycopg2-binary>=2.9",
]
s3 = [
  "boto3>=1.35,<2",
]
encryption = [
  "cryptography>=43,<47",
]
archives = [
  "py7zr>=1.1.3,<2",
  "pycdlib>=1.20,<2",
  "rarfile>=4.5,<5",
]
typing = [
  "basedpyright>=1.39,<2",
  "libcst>=1.8,<2",
  "mypy>=1.20,<3",
  "ruff>=0.12,<1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["LiuXin_alpha*", "past*"]
exclude = [
  "LiuXin_tests*",
  "LiuXin_alpha.file_formats.lrf.html.demo*",
  "LiuXin_alpha.file_formats.oeb.display.test-cfi*",
  "LiuXin_alpha.file_formats.oeb.polish.tests*",
  "LiuXin_alpha.utils.decompression.rarfile.test*",
  "LiuXin_alpha.working-memory*",
]
namespaces = true

[tool.setuptools.package-data]
"LiuXin_alpha.catalog" = ["py.typed"]
"LiuXin_alpha.databases.database_driver_plugins.SQL.database_generator_frbr" = [
  "aggregate_sql/*.sql",
  "*.toml",
  "table_sql/*/*.sql",
  "trigger_sql/*/*.sql",
]
"LiuXin_alpha.file_formats.oeb.display" = ["*.coffee"]
"LiuXin_alpha.file_formats.oeb.polish" = ["*.coffee"]
"LiuXin_alpha.startup_scripts" = ["LX_folders", "lx_folders.json"]
"LiuXin_alpha.utils.libraries.iso639" = ["ISO-639-2_utf-8.txt"]
"LiuXin_alpha.utils.libraries.liuxin_dateutil.zoneinfo" = ["zoneinfo-*.tar.gz"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = [
  "src/LiuXin_alpha/core/services.py",
  "src/LiuXin_alpha/core/program_api.py",
  "src/LiuXin_alpha/core/program_endpoints",
  "src/LiuXin_alpha/ingest/mixed_application.py",
  "src/LiuXin_alpha/catalog/write/host_api.py",
  "src/LiuXin_alpha/catalog/api/metadata_tools_api/facades.py",
  "src/LiuXin_alpha/storage/api",
  "src/LiuXin_alpha/storage/storage_manager/manager.py",
  "src/LiuXin_alpha/storage/storage_manager/mixins",
  "src/LiuXin_alpha/surfaces/cli/storage.py",
]
strict = [
  "src/LiuXin_alpha/core/program_endpoints",
  "src/LiuXin_alpha/ingest/mixed_application.py",
  "src/LiuXin_alpha/catalog/write/host_api.py",
  "src/LiuXin_alpha/catalog/api/metadata_tools_api/facades.py",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "build",
  "dist",
  "working-memory/test-results",
]
pythonVersion = "3.12"

[tool.mypy]
python_version = "3.12"
files = [
  "src/LiuXin_alpha/core/services.py",
  "src/LiuXin_alpha/core/program_api.py",
  "src/LiuXin_alpha/core/program_endpoints",
  "src/LiuXin_alpha/ingest/mixed_application.py",
  "src/LiuXin_alpha/storage/api",
  "src/LiuXin_alpha/storage/storage_manager/manager.py",
  "src/LiuXin_alpha/storage/storage_manager/mixins",
  "src/LiuXin_alpha/surfaces/cli/storage.py",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true
explicit_package_bases = true
strict = true
follow_imports = "skip"
warn_return_any = false
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
  "^working-memory/test-results/",
]
