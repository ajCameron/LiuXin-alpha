[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liuxin-alpha"
version = "0.0.0"
description = "LiuXin alpha codebase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "chardet>=5.0",
  "cssselect>=1.2",
  "lxml>=5.0",
  "numpy>=1.26",
]

[project.scripts]
liuxin = "LiuXin_alpha.surfaces.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-json-report>=1.5",
  "pytest-xdist>=3.5",
  "PyYAML>=6,<7",
  "markdown-it-py>=3,<5",
  "python-dateutil>=2.8",
  "py7zr>=1.1.3,<2",
  "pycdlib>=1.20,<2",
  "rarfile>=4.5,<5",
]
search = [
  "rapidfuzz>=3.9",
]
postgres = [
  "psycopg2-binary>=2.9",
]
s3 = [
  "boto3>=1.35,<2",
]
encryption = [
  "cryptography>=43,<47",
]
archives = [
  "py7zr>=1.1.3,<2",
  "pycdlib>=1.20,<2",
  "rarfile>=4.5,<5",
]
conversion = [
  "cssutils>=2.11,<3",
  "Pillow>=10,<13",
  "regex>=2024.5",
]
typing = [
  "basedpyright>=1.39,<2",
  "libcst>=1.8,<2",
  "mypy>=1.20,<3",
  "ruff==0.16.5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["LiuXin_alpha*", "past*"]
exclude = [
  "LiuXin_tests*",
  "LiuXin_alpha.file_formats.lrf.html.demo*",
  "LiuXin_alpha.file_formats.oeb.display.test-cfi*",
  "LiuXin_alpha.file_formats.oeb.polish.tests*",
  "LiuXin_alpha.utils.decompression.rarfile.test*",
  "LiuXin_alpha.working-memory*",
]
namespaces = true

[tool.setuptools.package-data]
"LiuXin_alpha.catalog" = ["py.typed"]
"LiuXin_alpha.resources" = [
  "calibre/*",
  "calibre/catalog/*",
  "calibre/content-server/*",
  "calibre/dictionaries/*",
  "calibre/dictionaries/en-GB/*",
  "calibre/dictionaries/en-US/*",
  "calibre/dictionaries/es-ES/*",
  "calibre/editor-help/*",
  "calibre/fonts/*",
  "calibre/images/*",
  "calibre/images/devices/*",
  "calibre/images/mimetypes/*",
  "calibre/images/plugins/*",
  "calibre/images/textures/*",
  "calibre/jacket/*",
  "calibre/quick_start/*",
  "calibre/rapydscript/*",
  "calibre/templates/*",
]
"LiuXin_alpha.databases.database_driver_plugins.SQL.database_generator_frbr" = [
  "aggregate_sql/*.sql",
  "*.toml",
  "table_sql/*/*.sql",
  "trigger_sql/*/*.sql",
]
"LiuXin_alpha.file_formats.oeb.display" = ["*.coffee"]
"LiuXin_alpha.file_formats.oeb.polish" = ["*.coffee"]
"LiuXin_alpha.startup_scripts" = ["LX_folders", "lx_folders.json"]
"LiuXin_alpha.utils.libraries.iso639" = ["ISO-639-2_utf-8.txt"]
"LiuXin_alpha.utils.libraries.liuxin_dateutil.zoneinfo" = ["zoneinfo-*.tar.gz"]

[tool.ruff]
target-version = "py312"
line-length = 88
required-version = "==0.16.5"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.liuxin.format]
# Positive scope: directory entries also protect newly added Python modules.
# Formatting does not implicitly expand the separate lint or typing ratchets.
paths = [
  "src/LiuXin_alpha/surfaces/terminal/browser_components",
  "src/LiuXin_alpha/surfaces/terminal/windowed_components",
  "tests/surfaces/test_terminal_component_ownership.py",
