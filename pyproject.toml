[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liuxin-alpha"
version = "0.0.0"
description = "LiuXin alpha codebase"
requires-python = ">=3.12"
dependencies = [
  "chardet>=5.0",
  "cssselect>=1.2",
  "lxml>=5.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-json-report>=1.5",
  "pytest-xdist>=3.5",
  "python-dateutil>=2.8",
]
search = [
  "rapidfuzz>=3.9",
]
postgres = [
  "psycopg2-binary>=2.9",
]
typing = [
  "basedpyright>=1.39,<2",
  "mypy>=1.20,<3",
]

[tool.basedpyright]
include = [
  "src/LiuXin_alpha/catalog/api",
  "src/LiuXin_alpha/catalog/catalog.py",
  "src/LiuXin_alpha/catalog/matching",
  "src/LiuXin_alpha/catalog/mutations",
  "src/LiuXin_alpha/catalog/repositories",
  "src/LiuXin_alpha/catalog/retrieval",
  "src/LiuXin_alpha/catalog/write",
  "src/LiuXin_alpha/metadata/api",
  "src/LiuXin_alpha/metadata/containers/metadata_containers",
  "src/LiuXin_alpha/surfaces/renderers",
]
strict = [
  "src/LiuXin_alpha/catalog/api",
  "src/LiuXin_alpha/catalog/catalog.py",
  "src/LiuXin_alpha/catalog/matching",
  "src/LiuXin_alpha/catalog/mutations",
  "src/LiuXin_alpha/catalog/repositories",
  "src/LiuXin_alpha/catalog/retrieval",
  "src/LiuXin_alpha/catalog/write",
  "src/LiuXin_alpha/metadata/api",
  "src/LiuXin_alpha/metadata/containers/metadata_containers",
  "src/LiuXin_alpha/surfaces/renderers",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "build",
  "dist",
  "working-memory/test-results",
]
pythonVersion = "3.12"

[tool.mypy]
python_version = "3.12"
files = [
  "src/LiuXin_alpha/catalog/api",
  "src/LiuXin_alpha/catalog/catalog.py",
  "src/LiuXin_alpha/catalog/matching",
  "src/LiuXin_alpha/catalog/mutations",
  "src/LiuXin_alpha/catalog/repositories",
  "src/LiuXin_alpha/catalog/retrieval",
  "src/LiuXin_alpha/catalog/write",
  "src/LiuXin_alpha/metadata/api",
  "src/LiuXin_alpha/metadata/containers/metadata_containers",
  "src/LiuXin_alpha/surfaces/renderers",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true
explicit_package_bases = true
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
  "^working-memory/test-results/",
]
