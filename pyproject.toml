[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liuxin-alpha"
dynamic = ["version"]
description = "Alpha-stage ebook cataloguing, ingest, and storage toolkit"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "chardet>=5.0",
  "cssselect>=1.2",
  "lxml>=5.0",
  "numpy>=1.26",
  "python-dateutil>=2.8",
]

[project.urls]
Homepage = "https://github.com/ajCameron/LiuXin-alpha"
Repository = "https://github.com/ajCameron/LiuXin-alpha"
Issues = "https://github.com/ajCameron/LiuXin-alpha/issues"

[project.scripts]
liuxin = "LiuXin_alpha.surfaces.terminal.text_browser:main"
liuxin-cli = "LiuXin_alpha.surfaces.cli:main"
liuxin-storage-audit = "LiuXin_alpha.surfaces.cli.storage_audit:main"

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-json-report>=1.5",
  "pytest-xdist>=3.5",
]
search = [
  "rapidfuzz>=3.9",
]
postgres = [
  "psycopg2-binary>=2.9",
]
typing = [
  "basedpyright>=1.39,<2",
  "libcst>=1.8,<2",
  "mypy>=1.20,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "LiuXin_alpha._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["LiuXin_alpha*", "past*"]
exclude = ["LiuXin_tests*"]
namespaces = true

[tool.setuptools.package-data]
LiuXin_alpha = [
  "catalog/py.typed",
  "databases/database_driver_plugins/SQL/database_generator_frbr/*.toml",
  "databases/database_driver_plugins/SQL/database_generator_frbr/*.txt",
  "databases/database_driver_plugins/SQL/database_generator_frbr/candidate_triggers",
  "databases/database_driver_plugins/SQL/database_generator_frbr/aggregate_sql/*.sql",
  "databases/database_driver_plugins/SQL/database_generator_frbr/table_sql/*/*.sql",
  "databases/database_driver_plugins/SQL/database_generator_frbr/trigger_sql/*/*.sql",
  "file_formats/epub/cfi/*.ebnf",
  "file_formats/unihandecode/pykakasi/*.utf8",
  "startup_scripts/LX_folders",
  "startup_scripts/*.json",
  "utils/libraries/iso639/*.txt",
  "utils/libraries/iso639/*.md",
  "utils/libraries/liuxin_dateutil/zoneinfo/*.tar.gz",
]

[tool.basedpyright]
include = [
  "src/LiuXin_alpha/catalog/api",
  "src/LiuXin_alpha/catalog/catalog.py",
  "src/LiuXin_alpha/catalog/matching",
  "src/LiuXin_alpha/catalog/mutations",
  "src/LiuXin_alpha/catalog/repositories",
  "src/LiuXin_alpha/catalog/retrieval",
  "src/LiuXin_alpha/catalog/write",
  "src/LiuXin_alpha/metadata/api",
  "src/LiuXin_alpha/metadata/containers/metadata_containers",
  "src/LiuXin_alpha/surfaces/renderers",
]
strict = [
  "src/LiuXin_alpha/catalog/api",
  "src/LiuXin_alpha/catalog/catalog.py",
  "src/LiuXin_alpha/catalog/matching",
  "src/LiuXin_alpha/catalog/mutations",
  "src/LiuXin_alpha/catalog/repositories",
  "src/LiuXin_alpha/catalog/retrieval",
  "src/LiuXin_alpha/catalog/write",
  "src/LiuXin_alpha/metadata/api",
  "src/LiuXin_alpha/metadata/containers/metadata_containers",
  "src/LiuXin_alpha/surfaces/renderers",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "build",
  "dist",
  "working-memory/test-results",
]
pythonVersion = "3.12"

[tool.mypy]
python_version = "3.12"
files = [
  "src/LiuXin_alpha/catalog/api",
  "src/LiuXin_alpha/catalog/catalog.py",
  "src/LiuXin_alpha/catalog/matching",
  "src/LiuXin_alpha/catalog/mutations",
  "src/LiuXin_alpha/catalog/repositories",
  "src/LiuXin_alpha/catalog/retrieval",
  "src/LiuXin_alpha/catalog/write",
  "src/LiuXin_alpha/metadata/api",
  "src/LiuXin_alpha/metadata/containers/metadata_containers",
  "src/LiuXin_alpha/surfaces/renderers",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true
explicit_package_bases = true
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
  "^working-memory/test-results/",
]
