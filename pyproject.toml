[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liuxin-alpha"
version = "0.0.0"
description = "LiuXin alpha codebase"
requires-python = ">=3.12"
dependencies = [
  "chardet>=5.0",
  "cssselect>=1.2",
  "lxml>=5.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-json-report>=1.5",
  "pytest-xdist>=3.5",
  "python-dateutil>=2.8",
]
search = [
  "rapidfuzz>=3.9",
]
