[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liuxin-alpha"
version = "0.0.0"
description = "LiuXin alpha codebase"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "LICENSES/*.txt"]
requires-python = ">=3.14"
dependencies = [
  "chardet>=5.0",
  "cssselect>=1.2",
  "lxml>=5.0",
  "numpy>=1.26",
  "python-dateutil>=2.8",
]

[project.scripts]
liuxin = "LiuXin_alpha.surfaces.cli.app:main"

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-json-report>=1.5",
  "pytest-xdist>=3.5",
  "PyYAML>=6,<7",
  "markdown-it-py>=3,<5",
  "py7zr>=1.1.3,<2",
  "pycdlib>=1.20,<2",
  "rarfile>=4.5,<5",
  "ruff==0.16.5",
]
search = [
  "rapidfuzz>=3.9",
  "regex>=2024.5",
]
postgres = [
  "psycopg2-binary>=2.9",
]
s3 = [
  "boto3>=1.35,<2",
]
encryption = [
  "cryptography>=43,<47",
]
# Writes PDF metadata, and checks the PDF reader against a second implementation.
# 6.1.3 has the fixes to incremental writing (5.8.0, 6.1.2) and limits on decompression.
pdf = [
  "pypdf>=6.1.3,<7",
]
archives = [
  "py7zr>=1.1.3,<2",
  "pycdlib>=1.20,<2",
  "rarfile>=4.5,<5",
]
conversion = [
  "cssutils>=2.11,<3",
  "Pillow>=10,<13",
  "regex>=2024.5",
]
typing = [
  "apsw>=3.45,<4",
  "psycopg2-binary>=2.9",
  "basedpyright>=1.39,<2",
  "libcst>=1.8,<2",
  "mypy>=1.20,<3",
  "types-psycopg2>=2.9,<3",
  "ruff==0.16.5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.data-files]
"share/man/man1" = [
  "docs/man/man1/liuxin.1",
  "docs/man/man1/liuxin-ingest.1",
  "docs/man/man1/liuxin-ingest-web.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["LiuXin_alpha*", "past*"]
exclude = [
  "LiuXin_tests*",
  "LiuXin_alpha.file_formats.lrf.html.demo*",
  "LiuXin_alpha.file_formats.oeb.display.test-cfi*",
  "LiuXin_alpha.file_formats.oeb.polish.tests*",
  "LiuXin_alpha.utils.decompression.rarfile.test*",
  "LiuXin_alpha.working-memory*",
]
namespaces = true

[tool.setuptools.package-data]
"LiuXin_alpha.utils.calibre_compat.caches.search" = ["provenance.json"]
"LiuXin_alpha.catalog" = ["py.typed"]
"LiuXin_alpha.databases" = ["py.typed"]
"LiuXin_alpha.utils.calibre_compat.database_generator" = ["py.typed"]
"LiuXin_alpha.resources" = [
  "calibre/*",
  "calibre/catalog/*",
  "calibre/content-server/*",
  "calibre/dictionaries/*",
  "calibre/dictionaries/en-GB/*",
  "calibre/dictionaries/en-US/*",
  "calibre/dictionaries/es-ES/*",
  "calibre/editor-help/*",
  "calibre/fonts/*",
  "calibre/images/*",
  "calibre/images/devices/*",
  "calibre/images/mimetypes/*",
  "calibre/images/plugins/*",
  "calibre/images/textures/*",
  "calibre/jacket/*",
  "calibre/quick_start/*",
  "calibre/rapydscript/*",
  "calibre/templates/*",
]
"LiuXin_alpha.databases.database_driver_plugins.SQL.database_generator_frbr" = [
  "aggregate_sql/*.sql",
  "*.toml",
  "table_sql/*/*.sql",
  "trigger_sql/*/*.sql",
]
"LiuXin_alpha.file_formats.oeb.display" = ["*.coffee"]
"LiuXin_alpha.metadata.upstream_calibre" = ["iso_codes.json.gz", "mime.types"]
"LiuXin_alpha.file_formats.oeb.polish" = ["*.coffee"]
"LiuXin_alpha.file_formats.epub.cfi" = ["epubcfi.ebnf"]
"LiuXin_alpha.file_formats.unihandecode.pykakasi" = ["*.utf8"]
"LiuXin_alpha.startup_scripts" = ["LX_folders", "lx_folders.json"]
"LiuXin_alpha.utils.libraries.iso639" = ["ISO-639-2_utf-8.txt"]
"LiuXin_alpha.utils.libraries.liuxin_dateutil.zoneinfo" = ["zoneinfo-*.tar.gz"]
"LiuXin_alpha.utils.libraries.python_dateutil" = ["LICENSE"]

[tool.ruff]
target-version = "py314"
line-length = 88
required-version = "==0.16.5"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

