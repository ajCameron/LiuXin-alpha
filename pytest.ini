[pytest]
# Having a repo-root config file stabilizes fixture discovery for IDE sub-runs.
# Without it, pytest may pick a nested directory as `rootdir`, which prevents
# it from seeing shared fixtures in `tests/conftest.py`.

minversion = 7.4
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra

# Fixture database copies otherwise accumulate throughout large runs.
# Keep failed-test scratch data and only the two most recent retained sessions.
# Override with -o tmp_path_retention_policy=all when debugging fixture failures.
tmp_path_retention_policy = failed
tmp_path_retention_count = 2

markers =
    slow: long-running tests (opt-in)
    integration: touches filesystem / external resources
    db: exercises database provisioning or schema creation
    live_web: exercises real web metadata backends (opt-in)
    live_storage: exercises real remote storage backends (opt-in)

norecursedirs =
    .*
    build
    dist
    .venv
    venv
    __pycache__
