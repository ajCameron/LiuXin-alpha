name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  packaging:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Installed Wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and verify the installed wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install dist/liuxin_alpha-*.whl
          python scripts/verify_wheel_install.py dist/liuxin_alpha-*.whl

  quality-modern:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Modern Architecture and Typing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install ".[test,typing]"

      - name: Run ratcheted modern type and import checks
        run: bash scripts/run_type_checks.sh

      - name: Enforce application-surface ownership
        env:
          PYTHONPATH: src
        run: |
          .venv/bin/python -m pytest -q \
            tests/surfaces/test_core_boundary_enforcement.py \
            tests/scripts/test_public_documentation_boundaries.py \
            tests/scripts/test_run_type_checks.py \
            tests/scripts/test_internal_type_contracts.py \
            tests/scripts/test_workflow_ownership.py \
            tests/scripts/test_check_modern_import_cycles.py \
            tests/surfaces/test_shared_surface_dependencies.py \
            tests/surfaces/test_read_model_failure_contracts.py \
            tests/surfaces/test_surface_read_errors.py \
            tests/surfaces/test_read_model_transport_errors.py \
            tests/core/test_core_application_api.py \
            tests/databases/caches/test_writer_dependencies.py \
            tests/core/test_evacuation_workflow.py \
            tests/core/test_program_workflow_facade.py \
            tests/storage/api/test_storage_manager_composition.py

  smoke:
    if: github.event_name == 'push'
    name: Confidence Tests (push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,conversion]"

      - name: Run confidence test stream
        env:
          PYTHONPATH: src
        run: python scripts/run_test_stream.py --stream confidence -- --maxfail=1

  file-formats-fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: File Formats Fast Lane
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,conversion]"

      - name: Run fast file_formats lane
        env:
          PYTHONPATH: src
        run: python scripts/run_file_formats_lane.py --lane fast

  file-formats-heavy:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: File Formats Heavy Lane
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,conversion]"

      - name: Run heavy file_formats lane
        env:
          PYTHONPATH: src
        run: python scripts/run_file_formats_lane.py --lane heavy

  full:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Full Test Suite (PR)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,conversion]"

      - name: Run full test suite
        env:
          PYTHONPATH: src
        run: pytest -q tests
