name: Live Storage Read Contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: live-storage-readonly
  cancel-in-progress: false

jobs:
  read-contract:
    name: ${{ matrix.backend }} read contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository environment protection prevents untrusted PR/fork code from
    # receiving the read-only endpoint credentials.
    environment: live-storage-readonly
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: http
            test: test_live_http_read_contract
            root_secret: LIUXIN_LIVE_HTTP_ROOT
            key_secret: LIUXIN_LIVE_HTTP_KEY
          - backend: ftp
            test: test_live_ftp_read_contract
            root_secret: LIUXIN_LIVE_FTP_ROOT
            key_secret: LIUXIN_LIVE_FTP_KEY
          - backend: rclone
            test: test_live_rclone_read_contract
            root_secret: LIUXIN_LIVE_RCLONE_ROOT
            key_secret: LIUXIN_LIVE_RCLONE_KEY
          - backend: s3
            test: test_live_s3_read_contract
            root_secret: LIUXIN_LIVE_S3_ROOT
            key_secret: LIUXIN_LIVE_S3_KEY

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test and backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,s3]"
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Run one read-only backend contract
        shell: bash
        env:
          PYTHONPATH: src
          LIUXIN_RUN_LIVE_STORAGE_TESTS: "1"
          LIVE_ROOT: ${{ secrets[matrix.root_secret] }}
          LIVE_KEY: ${{ secrets[matrix.key_secret] }}
          RCLONE_CONFIG_SECRET: ${{ secrets.LIUXIN_LIVE_RCLONE_CONFIG }}
          AWS_ACCESS_KEY_ID: ${{ secrets.LIUXIN_LIVE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LIUXIN_LIVE_S3_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.LIUXIN_LIVE_S3_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.LIUXIN_LIVE_S3_REGION }}
        run: |
          set -euo pipefail
          test -n "$LIVE_ROOT"
          test -n "$LIVE_KEY"
          case "${{ matrix.backend }}" in
            http)
              export LIUXIN_LIVE_HTTP_ROOT="$LIVE_ROOT"
              export LIUXIN_LIVE_HTTP_KEY="$LIVE_KEY"
              ;;
            ftp)
              export LIUXIN_LIVE_FTP_ROOT="$LIVE_ROOT"
              export LIUXIN_LIVE_FTP_KEY="$LIVE_KEY"
              ;;
            rclone)
              export LIUXIN_LIVE_RCLONE_ROOT="$LIVE_ROOT"
              export LIUXIN_LIVE_RCLONE_KEY="$LIVE_KEY"
              if [ -n "$RCLONE_CONFIG_SECRET" ]; then
                export RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf"
                printf '%s' "$RCLONE_CONFIG_SECRET" > "$RCLONE_CONFIG"
                chmod 600 "$RCLONE_CONFIG"
              fi
              ;;
            s3)
              export LIUXIN_LIVE_S3_ROOT="$LIVE_ROOT"
              export LIUXIN_LIVE_S3_KEY="$LIVE_KEY"
              ;;
          esac
          pytest -q "tests/storage/test_live_backend_contracts.py::${{ matrix.test }}"
