name: Reuse SPDX Lint
run-name: "Checking for licensing issues in \"${{ github.ref }}\""

# The repository is not yet REUSE-compliant across vendored resources,
# generated fixtures, and legacy imported code. Keep this check available for
# explicit audits without failing every PR until that metadata pass is done.
on:
  workflow_dispatch:

jobs:
  SPDX-Lint:
    name: Check Reuse Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v3
