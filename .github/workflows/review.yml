name: Auto-Review
run-name: "Automated code review for \"${{ github.head_ref }}\""

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: review-${{ github.head_ref }}
  cancel-in-progress: true

env:
  # Which version of the reports Sonar receives.
  DEFAULT_OS: ubuntu
  DEFAULT_PYTHON: "3.12"

jobs:
  test:
    name: ${{ matrix.name }} Python code (ubuntu/py${{ matrix.version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        name: ["lint", "test"]
        version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run lint smoke
        if: matrix.name == 'lint'
        shell: bash
        run: python -m compileall -q src tests scripts

      - name: Run tests
        if: matrix.name == 'test'
        env:
          PYTHONPATH: src
        shell: bash
        run: pytest -q tests

  tests-passed:
    name: Tests Passed
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - name: Mark all test runs as successful
        run: /bin/true
