# Aggregate / derived tables (FRBR generator)
#
# This file replaces the legacy aggregate_tables.txt.
#
# Aggregates are optional. Keep them disabled while the core schema is in flux.
# When you are ready, set enabled=true and either:
#   - list explicit SQL scripts in sql_files (paths are relative to this folder), and/or
#   - point sql_folder at a directory of .sql files to execute (relative to this folder).
#
version = 1
enabled = true

# Views / read-model projections.
#
# These are intentionally *lossy* helpers aimed at UI and compatibility layers.
# The canonical truth remains in the FRBR/WEMI tables.
sql_files = ["aggregate_sql/wemi_views.sql"]

# Example:
# sql_files = ["aggregate_sql/works_search_cache.sql"]
# sql_folder = "aggregate_sql"
