# -----------------------------------------------------
# WEMI core linkage (non-pyramid)
# -----------------------------------------------------

[[interlinks]]
left_table = "works"
right_table = "expressions"
link_type = "many_to_many"
requested_columns = ["priority", "primary", "origin"]
rationale = """
Replaces the former `expressions.expression_work_id` foreign key with a many-to-many link table.

This removes the strict pyramid and allows one Expression to participate in multiple Works
(e.g. tete-beche / flip-book structures, shared expressions, modelling compilations).

 - priority: order expressions within a given work
 - primary: mark the primary work for an expression (when an expression links to multiple works)
 - origin: provenance for the link ("user_set", "calibre_import", ...)
"""

[[interlinks]]
left_table = "expressions"
right_table = "manifestations"
link_type = "many_to_many"
requested_columns = ["priority", "primary", "origin"]
rationale = """
Replaces the former `manifestations.manifestation_expression_id` foreign key with a many-to-many link table.

Allows multi-expression manifestations (e.g. bilingual editions) and shared manifestations where useful.

 - priority: order manifestations within a given expression
 - primary: mark the primary manifestation for an expression (when multiple exist)
 - origin: provenance for the link ("user_set", "calibre_import", ...)
"""


