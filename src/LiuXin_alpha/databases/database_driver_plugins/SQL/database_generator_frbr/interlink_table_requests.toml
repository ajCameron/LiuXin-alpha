# Interlink table requests (FRBR generator)
#
# Each [[interlinks]] entry requests an interlink table between two existing main tables.
# Add your "why this exists" notes in `rationale` (safe to be long / multi-line).
#
# NOTE: The generator normalises table names via match_to_table_name() (plural/singular fuzz).

version = 1
allow_redundant_links = true
warn_on_redundant_links = true

# Links that must never be created. If a requested interlink matches one of these pairs,
# the generator will abort with the given reason.

[[forbidden_interlinks]]
left_table = "expressions"
right_table = "org_agents"
reason = """org_agents are a specialization of agents; expressions should link to agents (or agent roles) instead.
Creating an expressions ↔ org_agents interlink duplicates the polymorphic agent link surface and invites contradictory tagging/roles.
Use expressions↔agents and join through agents ↔ org_agents when you need the organizational subtype."""

[[interlinks]]
left_table = "agents"
right_table = "comments"
link_type = "one_to_many"
requested_columns = []
rationale = """You want to be able to make comments on a generic agent"""

[[interlinks]]
left_table = "agents"
right_table = "expressions"
link_type = "many_to_many"
requested_columns = ["priority", "type", "nullable"]
