# Interlink table requests (FRBR generator)
#
# Each [[interlinks]] entry requests an interlink table between two existing main tables.
# Add your "why this exists" notes in `rationale` (safe to be long / multi-line).
#
# NOTE: The generator normalises table names via match_to_table_name() (plural/singular fuzz).

version = 3

# Links that must never be created. If a requested interlink matches one of these pairs,
# the generator will abort with the given reason.

# Thought about having a "nullable" column - instead, the easiest way to do that seems to be an incomplete link
# - Where you have an id for the src and None for the dst
# This is mostly for calibre emulation - allows it to deset the first entry if the calibre entry is None
# You can also have None as the top option without deleting everything

# Many-to-One and One-to-Many tables are duels of each other.

[[interlinks]]
left_table = "agents"
right_table = "comments"
link_type = "one_to_many"
requested_columns = ["priority", "origin",]
nullable = true
rationale = """
You can comment on an agent - in their role as a human. And an agent.
A single comment should only be on one agent.
"""

[[forbidden_interlinks]]
left_table = "expressions"
right_table = "org_agents"
reason = """
org_agents are a specialization of agents; expressions should link to agents (or agent roles) instead.
Creating an expressions ↔ org_agents interlink duplicates the polymorphic agent link surface and invites contradictory
tagging/roles.
Use expressions ↔ agents and join through agents ↔ org_agents when you need the organizational subtype."""

[[interlinks]]
left_table = "agents"
right_table = "expressions"
link_type = "many_to_many"
requested_columns = ["priority", "type", "origin"]
types = ["insert_marc_roles", ]
nullable = true
rationale = """
Which expressions the agents are responsible for?
Many agents can, and probaly will be, responsible for many expressions.

 - priority - provides a (here optional) ordering of the agents
 - type - the role the agent played in the expression
 - origin - Why do we think the agent is responsible for the given work in the given way?
"""

[[interlinks]]
left_table = "agents"
right_table = "feeds"
link_type = "many_to_many"
requested_columns = ["priority", "type"]
nullable = true
types = ["insert_marc_roles", ]
rationale = """
Agents also create and manage feeds of various sorts.
Additonally, Agents can co-operate on feeds, making the relationship many-many.
Agents - be they organisations or people - have feeds that can be linked to them.
Feeds are, after all, a form of creative expressions.
"""

