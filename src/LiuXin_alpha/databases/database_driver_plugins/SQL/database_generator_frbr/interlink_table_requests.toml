right_table = "feeds"
link_type = "many_to_many"
requested_columns = ["priority", "type", "nullable"]
types = ["insert_marc_roles", ]
rationale = """
Agents also create and manage feeds of various sorts.
Additonally, Agents can co-operate on feeds, making the relationship many-many."""

[[interlinks]]
left_table = "agents"
right_table = "images"
link_type = "many_to_many"
requested_columns = ["priority", "type", "nullable"]
types = ["logo", "agent_photo"]
rationale = """
You can assign pictures to agents - such as cover photos.
The relationship is many-many as some photos should be assigned to multiple agents.
For example, a human type agent may be an author in their own right.
But also an employee at an org type agent.
As such, they should have an author photo linked to them as an author and a photo linked to the other org as an employee.
"""

